groq:
  transcription_model: whisper-large-v3
  translation_model: whisper-large-v3
  # llama-3.1-8b-instant was retired by Groq (404 model_not_found), which silently
  # disabled every rewrite and translation. Chosen by a measured comparison of the
  # models this key can reach (docs/stage3_fixes_stage4_review.md).
  chat_model: qwen/qwen3.8-27b
  reasoning_effort: none
  temperature: 0
  timeout_seconds: 20

limits:
  max_audio_seconds: 60
  max_audio_bytes: 10485760
  max_text_chars: 1000

tts:
  provider: edge
  edge:
    mr: mr-IN-AarohiNeural
    hi: hi-IN-SwaraNeural
    en: en-IN-NeerjaExpressiveNeural
  gtts:
    mr: mr
    hi: hi
    en: en

review:
  # Minimum same-language embedding similarity to reuse an expert's answer for a new
  # question. Chosen by python -m src.review.calibrate_reuse
  # (reports/stage4/reviewed_reuse_report.md).
  reuse_min_similarity: 0.936
