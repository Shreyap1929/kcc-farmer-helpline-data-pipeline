# Fixed farmer-facing replies for every route that is not a grounded historical answer.
# Placeholders: {case_id}, and the helpline numbers from config/triage.yaml `pointers`
# ({kcc_helpline}, {pm_kisan_helpline}, {crop_insurance_helpline}).
# Marathi and Hindi wording still needs a native speaker's review before real use.
needs_native_review: true
templates:
  CLARIFY_CROP_MISSING:
    en: "Which crop is this about? Please also tell us how old the crop is."
    mr: "हा कोणत्या पिकाबद्दल प्रश्न आहे? पीक किती दिवसांचे आहे तेही सांगा."
    hi: "यह किस फसल के बारे में है? फसल कितने दिन की है, यह भी बताइए."
  CLARIFY_VAGUE:
    en: "Please tell us which crop and what problem you are seeing."
    mr: "कृपया कोणते पीक आहे आणि कोणती अडचण दिसत आहे ते सांगा."
    hi: "कृपया फसल का नाम और उसमें दिख रही समस्या बताइए."
  SCHEME_POINTER:
    en: "Scheme rules and status can change. Please confirm with your taluka agriculture office or the Kisan Call Centre ({kcc_helpline}). PM-Kisan instalments: {pm_kisan_helpline}. Crop insurance: {crop_insurance_helpline}."
    mr: "योजनेचे नियम आणि स्थिती बदलू शकते. कृपया तालुका कृषी कार्यालय किंवा किसान कॉल सेंटरकडून ({kcc_helpline}) खात्री करा. पीएम-किसान हप्ता: {pm_kisan_helpline}. पीक विमा: {crop_insurance_helpline}."
    hi: "योजना के नियम और स्थिति बदल सकते हैं. कृपया तालुका कृषि कार्यालय या किसान कॉल सेंटर ({kcc_helpline}) से पुष्टि करें. पीएम-किसान किस्त: {pm_kisan_helpline}. फसल बीमा: {crop_insurance_helpline}."
  LIVE_DATA_POINTER:
    en: "Past records cannot confirm today's price or weather. For prices check your APMC market or agmarknet.gov.in, for weather the IMD Meghdoot app, or call the Kisan Call Centre on {kcc_helpline}."
    mr: "जुन्या नोंदींवरून आजचा बाजारभाव किंवा हवामान सांगता येत नाही. बाजारभावासाठी बाजार समिती किंवा agmarknet.gov.in, हवामानासाठी IMD मेघदूत ॲप पाहा, किंवा किसान कॉल सेंटरला {kcc_helpline} वर फोन करा."
    hi: "पुराने रिकॉर्ड से आज का भाव या मौसम पता नहीं चल सकता. भाव के लिए अपनी मंडी या agmarknet.gov.in, मौसम के लिए IMD मेघदूत ऐप देखें, या किसान कॉल सेंटर को {kcc_helpline} पर फोन करें."
  EXPERT_REVIEW:
    en: "An agriculture expert will review your question. Your case number is {case_id}. The answer will appear here when it is ready."
    mr: "कृषी तज्ज्ञ तुमच्या प्रश्नाची तपासणी करतील. तुमचा प्रकरण क्रमांक {case_id} आहे. उत्तर तयार झाल्यावर ते इथे दिसेल."
    hi: "कृषि विशेषज्ञ आपके प्रश्न की समीक्षा करेंगे. आपका केस नंबर {case_id} है. जवाब तैयार होने पर यहाँ दिखेगा."
  OUT_OF_SCOPE:
    en: "This helpline handles farming questions. For other help please call the Kisan Call Centre on {kcc_helpline}."
    mr: "ही हेल्पलाइन शेतीविषयक प्रश्नांसाठी आहे. इतर मदतीसाठी किसान कॉल सेंटरला {kcc_helpline} वर फोन करा."
    hi: "यह हेल्पलाइन खेती से जुड़े सवालों के लिए है. अन्य सहायता के लिए किसान कॉल सेंटर को {kcc_helpline} पर फोन करें."
  # Stage 4: replies delivered after an expert resolves a case.
  EXPERT_ANSWER_HEADER:
    en: "Expert answer for case {case_id}:"
    mr: "प्रकरण {case_id} साठी तज्ज्ञांचे उत्तर:"
    hi: "केस {case_id} के लिए विशेषज्ञ का जवाब:"
  REFERRED:
    en: "An expert reviewed your question (case {case_id}). It needs a local check: please contact your taluka agriculture officer or Krishi Vigyan Kendra, or call the Kisan Call Centre on {kcc_helpline}."
    mr: "तज्ज्ञांनी तुमचा प्रश्न तपासला (प्रकरण {case_id}). यासाठी स्थानिक पाहणी आवश्यक आहे: कृपया तालुका कृषी अधिकारी किंवा कृषी विज्ञान केंद्राशी संपर्क करा, किंवा किसान कॉल सेंटरला {kcc_helpline} वर फोन करा."
    hi: "विशेषज्ञ ने आपका सवाल देखा (केस {case_id}). इसके लिए स्थानीय जाँच ज़रूरी है: कृपया तालुका कृषि अधिकारी या कृषि विज्ञान केंद्र से संपर्क करें, या किसान कॉल सेंटर को {kcc_helpline} पर फोन करें."
  EXPERT_NOTE:
    en: "Expert's note:"
    mr: "तज्ज्ञांची सूचना:"
    hi: "विशेषज्ञ की टिप्पणी:"
  REVIEWED_SOURCE:
    en: "Answered earlier by a KCC expert for a similar question (case {case_id}, {date})."
    mr: "अशाच प्रश्नासाठी KCC तज्ज्ञांनी आधी दिलेले उत्तर (प्रकरण {case_id}, {date})."
    hi: "ऐसे ही सवाल के लिए KCC विशेषज्ञ का पहले दिया गया जवाब (केस {case_id}, {date})."
