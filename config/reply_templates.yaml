needs_native_review: true
templates:
  CLARIFY_CROP_MISSING:
    en: "Which crop is this about? Please also tell us how old the crop is."
    mr: "\u0939\u093e \u0915\u094b\u0923\u0924\u094d\u092f\u093e \u092a\u093f\u0915\u093e\u092c\u0926\u094d\u0926\u0932 \u092a\u094d\u0930\u0936\u094d\u0928 \u0906\u0939\u0947? \u092a\u0940\u0915 \u0915\u093f\u0924\u0940 \u0926\u093f\u0935\u0938\u093e\u0902\u091a\u0947 \u0906\u0939\u0947 \u0924\u0947\u0939\u0940 \u0938\u093e\u0902\u0917\u093e."
    hi: "\u092f\u0939 \u0915\u093f\u0938 \u092b\u0938\u0932 \u0915\u0947 \u092c\u093e\u0930\u0947 \u092e\u0947\u0902 \u0939\u0948? \u092b\u0938\u0932 \u0915\u093f\u0924\u0928\u0947 \u0926\u093f\u0928 \u0915\u0940 \u0939\u0948, \u092f\u0939 \u092d\u0940 \u092c\u0924\u093e\u0907\u090f."
  CLARIFY_VAGUE:
    en: "Please tell us which crop and what problem you are seeing."
    mr: "\u0915\u0943\u092a\u092f\u093e \u0915\u094b\u0923\u0924\u0947 \u092a\u0940\u0915 \u0906\u0939\u0947 \u0906\u0923\u093f \u0915\u094b\u0923\u0924\u0940 \u0905\u0921\u091a\u0923 \u0926\u093f\u0938\u0924 \u0906\u0939\u0947 \u0924\u0947 \u0938\u093e\u0902\u0917\u093e."
    hi: "\u0915\u0943\u092a\u092f\u093e \u092b\u0938\u0932 \u0915\u093e \u0928\u093e\u092e \u0914\u0930 \u0909\u0938\u092e\u0947\u0902 \u0926\u093f\u0916 \u0930\u0939\u0940 \u0938\u092e\u0938\u094d\u092f\u093e \u092c\u0924\u093e\u0907\u090f."
  SCHEME_POINTER:
    en: "Scheme rules and status can change. Please confirm with your taluka agriculture office or the Kisan Call Centre."
    mr: "\u092f\u094b\u091c\u0928\u0947\u091a\u0947 \u0928\u093f\u092f\u092e \u0906\u0923\u093f \u0938\u094d\u0925\u093f\u0924\u0940 \u092c\u0926\u0932\u0942 \u0936\u0915\u0924\u0947. \u0915\u0943\u092a\u092f\u093e \u0924\u093e\u0932\u0941\u0915\u093e \u0915\u0943\u0937\u0940 \u0915\u093e\u0930\u094d\u092f\u093e\u0932\u092f \u0915\u093f\u0902\u0935\u093e \u0915\u093f\u0938\u093e\u0928 \u0915\u0949\u0932 \u0938\u0947\u0902\u091f\u0930\u0915\u0921\u0942\u0928 \u0916\u093e\u0924\u094d\u0930\u0940 \u0915\u0930\u093e."
    hi: "\u092f\u094b\u091c\u0928\u093e \u0915\u0947 \u0928\u093f\u092f\u092e \u0914\u0930 \u0938\u094d\u0925\u093f\u0924\u093f \u092c\u0926\u0932 \u0938\u0915\u0924\u0947 \u0939\u0948\u0902. \u0915\u0943\u092a\u092f\u093e \u0924\u093e\u0932\u0941\u0915\u093e \u0915\u0943\u0937\u093f \u0915\u093e\u0930\u094d\u092f\u093e\u0932\u092f \u092f\u093e \u0915\u093f\u0938\u093e\u0928 \u0915\u0949\u0932 \u0938\u0947\u0902\u091f\u0930 \u0938\u0947 \u092a\u0941\u0937\u094d\u091f\u093f \u0915\u0930\u0947\u0902."
  LIVE_DATA_POINTER:
    en: "Past records cannot confirm today's price or weather. Please check an official current source or call the Kisan Call Centre."
    mr: "\u091c\u0941\u0928\u094d\u092f\u093e \u0928\u094b\u0902\u0926\u0940\u0902\u0935\u0930\u0942\u0928 \u0906\u091c\u091a\u093e \u092c\u093e\u091c\u093e\u0930\u092d\u093e\u0935 \u0915\u093f\u0902\u0935\u093e \u0939\u0935\u093e\u092e\u093e\u0928 \u0938\u093e\u0902\u0917\u0924\u093e \u092f\u0947\u0924 \u0928\u093e\u0939\u0940. \u0915\u0943\u092a\u092f\u093e \u0905\u0927\u093f\u0915\u0943\u0924 \u0924\u093e\u091c\u094d\u092f\u093e \u0938\u094d\u0930\u094b\u0924\u093e\u0935\u0930 \u0924\u092a\u093e\u0938\u093e \u0915\u093f\u0902\u0935\u093e \u0915\u093f\u0938\u093e\u0928 \u0915\u0949\u0932 \u0938\u0947\u0902\u091f\u0930\u0932\u093e \u092b\u094b\u0928 \u0915\u0930\u093e."
    hi: "\u092a\u0941\u0930\u093e\u0928\u0947 \u0930\u093f\u0915\u0949\u0930\u094d\u0921 \u0938\u0947 \u0906\u091c \u0915\u093e \u092d\u093e\u0935 \u092f\u093e \u092e\u094c\u0938\u092e \u092a\u0924\u093e \u0928\u0939\u0940\u0902 \u091a\u0932 \u0938\u0915\u0924\u093e. \u0915\u0943\u092a\u092f\u093e \u0906\u0927\u093f\u0915\u093e\u0930\u093f\u0915 \u0924\u093e\u091c\u093c\u093e \u0938\u094d\u0930\u094b\u0924 \u0926\u0947\u0916\u0947\u0902 \u092f\u093e \u0915\u093f\u0938\u093e\u0928 \u0915\u0949\u0932 \u0938\u0947\u0902\u091f\u0930 \u092a\u0930 \u092b\u094b\u0928 \u0915\u0930\u0947\u0902."
  EXPERT_REVIEW:
    en: "An agriculture expert will review your question. Your case number is {case_id}."
    mr: "\u0915\u0943\u0937\u0940 \u0924\u091c\u094d\u091c\u094d\u091e \u0924\u0941\u092e\u091a\u094d\u092f\u093e \u092a\u094d\u0930\u0936\u094d\u0928\u093e\u091a\u0940 \u0924\u092a\u093e\u0938\u0923\u0940 \u0915\u0930\u0924\u0940\u0932. \u0924\u0941\u092e\u091a\u093e \u092a\u094d\u0930\u0915\u0930\u0923 \u0915\u094d\u0930\u092e\u093e\u0902\u0915 {case_id} \u0906\u0939\u0947."
    hi: "\u0915\u0943\u0937\u093f \u0935\u093f\u0936\u0947\u0937\u091c\u094d\u091e \u0906\u092a\u0915\u0947 \u092a\u094d\u0930\u0936\u094d\u0928 \u0915\u0940 \u0938\u092e\u0940\u0915\u094d\u0937\u093e \u0915\u0930\u0947\u0902\u0917\u0947. \u0906\u092a\u0915\u093e \u0915\u0947\u0938 \u0928\u0902\u092c\u0930 {case_id} \u0939\u0948."
  OUT_OF_SCOPE:
    en: "This helpline handles farming questions. Please contact the Kisan Call Centre for agriculture-related help."
    mr: "\u0939\u0940 \u0939\u0947\u0932\u094d\u092a\u0932\u093e\u0907\u0928 \u0936\u0947\u0924\u0940\u0935\u093f\u0937\u092f\u0915 \u092a\u094d\u0930\u0936\u094d\u0928\u093e\u0902\u0938\u093e\u0920\u0940 \u0906\u0939\u0947. \u0915\u0943\u0937\u0940 \u092e\u0926\u0924\u0940\u0938\u093e\u0920\u0940 \u0915\u093f\u0938\u093e\u0928 \u0915\u0949\u0932 \u0938\u0947\u0902\u091f\u0930\u0936\u0940 \u0938\u0902\u092a\u0930\u094d\u0915 \u0915\u0930\u093e."
    hi: "\u092f\u0939 \u0939\u0947\u0932\u094d\u092a\u0932\u093e\u0907\u0928 \u0916\u0947\u0924\u0940 \u0938\u0947 \u091c\u0941\u0921\u093c\u0947 \u0938\u0935\u093e\u0932\u094b\u0902 \u0915\u0947 \u0932\u093f\u090f \u0939\u0948. \u0915\u0943\u0937\u093f \u0938\u0939\u093e\u092f\u0924\u093e \u0915\u0947 \u0932\u093f\u090f \u0915\u093f\u0938\u093e\u0928 \u0915\u0949\u0932 \u0938\u0947\u0902\u091f\u0930 \u0938\u0947 \u0938\u0902\u092a\u0930\u094d\u0915 \u0915\u0930\u0947\u0902."
