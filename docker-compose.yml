# docker compose up --build   ->  http://localhost:8000/chat , /expert , /
#
# Needs the Stage 1 + Stage 2 outputs in ./data (data/views, data/artifacts; build them
# once with `python -m src.triage.build`). Secrets (GROQ_API_KEY, EXPERT_ACCOUNTS) come
# from .env; without a Groq key typed chat still works and voice reports unavailable.
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - hf-cache:/cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
